[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-heartbeat"
version = "0.1.0"
description = "Fixed-prompt latency measurement for frontier language models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["anthropic>=0.70", "openai>=1.60", "google-genai>=1.0"]

# Only needed to serve the measurements to other agents; the measurement path
# and bench/advisor.py both run without it.
#
# mcp is pinned to >=2,<3 rather than >=1.2. The 2.0 release removed
# mcp.server.fastmcp and replaced it with MCPServer, so the old floor happily
# resolved to a version this code cannot import.
[project.optional-dependencies]
serve = ["mcp>=2,<3", "uvicorn>=0.30", "mangum>=0.17"]

[project.urls]
Homepage = "https://github.com/bsxp/llm-heartbeat"

[tool.setuptools]
packages = ["bench"]

[tool.setuptools.package-data]
bench = ["models.json"]
