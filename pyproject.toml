[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-heartbeat"
version = "0.1.0"
description = "Fixed-prompt latency measurement for frontier language models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["anthropic>=0.70", "openai>=1.60", "google-genai>=1.0"]

[project.urls]
Homepage = "https://github.com/bsxp/llm-heartbeat"

[tool.setuptools]
packages = ["bench"]

[tool.setuptools.package-data]
bench = ["models.json"]
